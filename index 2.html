<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEEX Mobile Scanner</title><style>body{margin:0;background:#0d111b;color:#f3f6ff;font:16px system-ui;padding:20px}main{max-width:720px;margin:auto}article{background:#1d2635;padding:17px;border-radius:14px;margin:12px 0}h1{font-size:24px}h2{font-size:19px}.muted{color:#9daabd}b{color:#6ee7b7}</style></head><body><main><h1>WEEX Mobile Scanner</h1><p class="muted">BTC · ETH · SOL · XRP · DOGE · INJ · FET · UNI</p><section id="out">Scanner laden...</section><p class="muted">Experimentele signalen; geen automatische orders. Cross margin en hoge leverage brengen liquidatierisico mee.</p></main><script>const fmt=x=>typeof x==='number'?x.toLocaleString('en-US',{maximumFractionDigits:6}):'—';async function load(){try{let r=await fetch('/api/signals',{cache:'no-store'});if(!r.ok)throw Error('API niet bereikbaar');let d=await r.json();document.getElementById('out').innerHTML=(d.signals||[]).map(s=>`<article><h2>${s.symbol} — <b>${s.side||s.status}</b></h2><p>Prijs: ${fmt(s.price)}</p><p>Entry: ${fmt(s.entry)} | SL: ${fmt(s.sl)}</p><p>TP1: ${fmt(s.tp1)} | TP2: ${fmt(s.tp2)}</p><p class="muted">${s.reason||''}</p></article>`).join('')||'Scanner start op...'}catch(e){document.getElementById('out').textContent='Fout: '+e.message}}load();setInterval(load,30000)</script></body></html>
